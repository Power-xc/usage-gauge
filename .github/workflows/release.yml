name: release

# Pushing a version tag (v1.0.0, …) builds both apps and publishes them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Core checks
        run: swift run CoreChecks
      - name: App bundle for Apple silicon and Intel
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent dist/UsageGauge.app UsageGauge-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: UsageGauge-macOS.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - name: Rust tests
        run: cargo test
        working-directory: windows/src-tauri
      - name: Build the installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
